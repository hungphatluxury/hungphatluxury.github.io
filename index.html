<style>
  :root{

    --ngoc-dam:#0E6F63;
    --do:#E05A3C;

    --mo:rgba(255,255,255,.42);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 80% at 50% 0%, var(--nen-2) 0%, var(--nen) 62%),
      var(--nen);
    color:#EAF3F0;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:0;overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ----- nút micro ----- */
  .san{position:relative;display:grid;place-items:center;width:min(78vw,320px);aspect-ratio:1}
  .song{
    position:absolute;inset:0;border-radius:50%;
    border:2px solid var(--ngoc);opacity:0;pointer-events:none;
  }
  body.nghe .song{animation:lan 2s cubic-bezier(.2,.6,.35,1) infinite}
  body.nghe .song:nth-child(2){animation-delay:.66s}
  body.nghe .song:nth-child(3){animation-delay:1.32s}
  @keyframes lan{0%{transform:scale(.62);opacity:.5}100%{transform:scale(1);opacity:0}}

  #nut{
    position:relative;z-index:2;
    width:62%;aspect-ratio:1;border:none;border-radius:50%;cursor:pointer;
    background:linear-gradient(160deg,var(--ngoc) 0%, var(--ngoc-dam) 100%);
    color:#04120F;display:grid;place-items:center;
    box-shadow:0 24px 60px -22px rgba(31,184,156,.9), inset 0 -6px 18px rgba(0,0,0,.18);
    transition:transform .16s ease, background .3s ease, box-shadow .3s ease;
  }
  #nut:active{transform:scale(.95)}
  #nut svg{width:44%;height:44%;fill:currentColor}
  body.cho #nut{animation:tho 3.4s ease-in-out infinite}
  @keyframes tho{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  body.nghe #nut{
    background:linear-gradient(160deg,#F0785C 0%, var(--do) 100%);
    box-shadow:0 24px 60px -22px rgba(224,90,60,.9), inset 0 -6px 18px rgba(0,0,0,.18);
  }
  body.doc #nut{
    background:linear-gradient(160deg,#F2C071 0%, var(--vang) 100%);
    box-shadow:0 24px 60px -22px rgba(227,168,74,.85), inset 0 -6px 18px rgba(0,0,0,.18);
  }
  #nut:disabled{background:#22332F;color:#4E625D;box-shadow:none;cursor:not-allowed;animation:none}
  #nut:focus-visible{outline:3px solid #EAF3F0;outline-offset:6px}

  /* ----- thanh sóng khi đang trả lời ----- */
  .loa{display:flex;gap:5px;align-items:flex-end;height:34px;margin-top:30px;opacity:0;transition:opacity .3s}
  body.doc .loa{opacity:1}
  .loa i{width:5px;height:9px;border-radius:3px;background:var(--vang);display:block;animation:nhun 1s ease-in-out infinite}
  .loa i:nth-child(2){animation-delay:.12s} .loa i:nth-child(3){animation-delay:.24s}
  .loa i:nth-child(4){animation-delay:.36s} .loa i:nth-child(5){animation-delay:.48s}
  .loa i:nth-child(6){animation-delay:.6s}  .loa i:nth-child(7){animation-delay:.72s}
  @keyframes nhun{0%,100%{height:9px}50%{height:32px}}

  /* ----- chấm trạng thái chờ ----- */
  .cho-cham{display:flex;gap:7px;margin-top:30px;height:34px;align-items:center;opacity:0;transition:opacity .3s}
  body.cho .cho-cham{opacity:.55}
  .cho-cham i{width:7px;height:7px;border-radius:50%;background:var(--mo);display:block}

  /* ----- hai nút liên hệ ----- */
  .lienhe{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;gap:18px;justify-content:center}
  .lienhe a{
    width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
    color:#EAF3F0;text-decoration:none;backdrop-filter:blur(6px);
  }
  .lienhe a:active{transform:translateY(1px)}
  .lienhe svg{width:24px;height:24px;fill:currentColor}
  .lienhe a:focus-visible{outline:2px solid #EAF3F0;outline-offset:3px}

  @media (prefers-reduced-motion: reduce){
    .song,#nut,.loa i{animation:none !important}
  }
</style>

/* ================= TIỆN ÍCH ================= */
const boDau = s => (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[đĐ]/g,"d")
  .toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();

function timCauTraLoi(cauHoi){
  const q = boDau(cauHoi);
  if(!q) return null;
  let best = null, diemCao = 0;
  for(const m of KHO){
    let diem = 0;
    for(const [tu, d] of m.kw) if(q.includes(tu)) diem += d;
    if(diem > diemCao){ diemCao = diem; best = m; }
  }
  return diemCao >= 4 ? best : null;
}

function moKhoaLoa(){                          // iPhone cần cú bấm đầu tiên mới cho phát tiếng
  if(daMoKhoa) return;
  daMoKhoa = true;
  try{
    loa.muted = true;
    const p = loa.play();
    if(p && p.then) p.then(() => { loa.pause(); loa.muted = false; }).catch(() => { loa.muted = false; });
    else { loa.pause(); loa.muted = false; }
  }catch(e){ loa.muted = false; }
}

  document.body.classList.add(ten);
  nut.setAttribute("aria-label",
    ten === "nghe" ? "Đang nghe, bấm để dừng" :
    ten === "doc"  ? "Đang trả lời" : "Bấm để nói câu hỏi");
}

function noi(id, xongThi){
  ngungNoi();
  trangThai("doc");
  loa.src = "audio/" + GIONG + "/" + id + ".mp3";
  loa.onended = () => { trangThai(troChuyen ? "nghe" : "cho"); if(xongThi) xongThi(); };
  loa.onerror = () => { trangThai(troChuyen ? "nghe" : "cho"); if(xongThi) xongThi(); };
  const p = loa.play();
  if(p && p.catch) p.catch(() => { trangThai(troChuyen ? "nghe" : "cho"); if(xongThi) xongThi(); });
}
function ngungNoi(){
  try{ loa.pause(); loa.currentTime = 0; }catch(e){}
}

/* ================= NGHE ================= */
let rec = null, dangNghe = false, coSTT = false, troChuyen = false, soLanImLang = 0;
const TOI_DA_IM_LANG = 3;

function trongAppChat(){
  return /Zalo|FBAN|FBAV|FB_IAB|Instagram|Line\//i.test(navigator.userAgent || "");
}

function khoiTao(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(trongAppChat() || !SR){
    nut.disabled = true;
    nut.addEventListener("click", () => noi(trongAppChat() ? BAO.moTrinhDuyet : BAO.khongNghe));
    // vẫn nói cho khách biết phải làm gì, ngay lần chạm đầu tiên vào màn hình
    document.addEventListener("click", function moLoi(){
      document.removeEventListener("click", moLoi);
      moKhoaLoa();
      noi(trongAppChat() ? BAO.moTrinhDuyet : BAO.khongNghe);
    }, {once:true});
    return;
  }
  rec = new SR();
  rec.lang = "vi-VN";
  rec.continuous = false;
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  rec.onresult = (e) => {
    let chot = "";
    for(let i = e.resultIndex; i < e.results.length; i++)
      if(e.results[i].isFinal) chot += e.results[i][0].transcript;
    chot = chot.trim();
    if(!chot) return;
    soLanImLang = 0;
    tatMic();                                   // tắt mic khi máy nói, khỏi nghe vọng tiếng loa
    const m = timCauTraLoi(chot);
    noi(m ? m.id : KHONG_HIEU.id, ngheTiep);    // đọc xong tự nghe câu tiếp
  };

  rec.onerror = (e) => {
    tatMic();
    if(e.error === "no-speech"){
      if(troChuyen && ++soLanImLang < TOI_DA_IM_LANG){ ngheTiep(); return; }
      troChuyen = false;
      noi(BAO.nghiTay);
      return;
    }
    troChuyen = false;
    trangThai("cho");
    if(e.error === "not-allowed" || e.error === "service-not-allowed")
      noi(trongAppChat() ? BAO.moTrinhDuyet : BAO.khongNghe);
  };

  rec.onend = () => { if(dangNghe){ tatMic(); if(troChuyen) ngheTiep(); } };
  coSTT = true;
}

function batMic(){
  if(!coSTT || dangNghe) return;
  ngungNoi();
  try{ rec.start(); }catch(e){ return; }
  dangNghe = true;
  trangThai("nghe");
}
function tatMic(){
  dangNghe = false;
  try{ rec && rec.stop(); }catch(e){}
}
function ngheTiep(){
  if(!troChuyen) return;
  setTimeout(() => { if(troChuyen && !dangNghe) batMic(); }, 400);
}

function batDau(){
  if(!coSTT) return;
  troChuyen = true;
  soLanImLang = 0;
  moKhoaLoa();
  noi(BAO.chao, () => batMic());               // chào một câu rồi nghe luôn
}
function dungHan(){
  troChuyen = false;
  ngungNoi();
  tatMic();
  trangThai("cho");
}

nut.addEventListener("click", () => { troChuyen ? dungHan() : batDau(); });
window.addEventListener("pagehide", dungHan);

khoiTao();
</script>
